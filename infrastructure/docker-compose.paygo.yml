version: '3.8'

services:
  # Pay-As-You-Go Billing Service
  paygo-service:
    build:
      context: ../services/paygo
      dockerfile: Dockerfile
    container_name: quantummint-paygo
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - PORT=5005
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=quantummint_paygo
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - EXCHANGE_RATE_SERVICE_URL=http://exchange-rate-service:5006
    networks:
      - quantummint-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5005/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Exchange Rate Service
  exchange-rate-service:
    build:
      context: ../services/exchange-rate
      dockerfile: Dockerfile
    container_name: quantummint-exchange-rate
    ports:
      - "5006:5006"
    environment:
      - NODE_ENV=production
      - PORT=5006
      - REDIS_URL=redis://redis:6379
      - EXCHANGE_RATE_API_KEY=${EXCHANGE_RATE_API_KEY}
    networks:
      - quantummint-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5006/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quantummint-network:
    external: true
