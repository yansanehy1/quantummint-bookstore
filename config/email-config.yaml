# Email System Configuration
# QuantumMint Bookstore

email:
  # Service Providers
  providers:
    sendgrid:
      api_key: ${SENDGRID_API_KEY}
      from_email: orders@quantummint.net
      from_name: "QuantumMint Bookstore"
      webhook_url: https://quantum.quantummint.net/webhook/sendgrid
    
    mailchimp:
      api_key: ${MAILCHIMP_API_KEY}
      server: us1
      list_id: ${MAILCHIMP_LIST_ID}
      from_name: "QuantumMint Newsletter"
  
  # SendGrid Template IDs
  templates:
    # Transactional
    order_confirmation: "d-abc123"
    order_shipped: "d-xyz789"
    order_out_for_delivery: "d-def456"
    order_delivered: "d-ghi789"
    
    # Customer Journey
    welcome_series_1: "d-wel001"
    welcome_series_2: "d-wel002"
    welcome_series_3: "d-wel003"
    
    # Abandoned Cart
    abandoned_cart_1h: "d-ac001"
    abandoned_cart_24h: "d-ac002"
    abandoned_cart_72h: "d-ac003"
    
    # Alerts
    back_in_stock: "d-bis001"
    price_drop: "d-pd001"
    preorder_reminder: "d-pre001"
    
    # Support
    support_ticket: "d-sup001"
    review_request: "d-rev001"
    
    # Loyalty
    points_earned: "d-loy001"
    tier_upgrade: "d-loy002"
    points_expiring: "d-loy003"
    
    # Marketing
    monthly_newsletter: "d-news001"
    personalized_recommendations: "d-rec001"
    
    # Re-engagement
    inactive_30_days: "d-re001"
    inactive_90_days: "d-re002"
    inactive_180_days: "d-re003"
  
  # Automation Rules
  automation:
    # Abandoned Cart Sequence
    abandoned_cart:
      enabled: true
      delay_1: "1 hour"
      delay_2: "24 hours"
      delay_3: "72 hours"
      discount_codes:
        stage_2: "CART5"
        stage_3: "CART10"
      max_reminders: 3
    
    # Welcome Series
    welcome_series:
      enabled: true
      email_1: "immediate"
      email_2: "3 days"
      email_3: "7 days"
      include_discount: true
      discount_code: "WELCOME10"
    
    # Review Requests
    review_request:
      enabled: true
      delay_after_delivery: "7 days"
      max_requests_per_order: 1
    
    # Back in Stock Alerts
    back_in_stock:
      enabled: true
      batch_notifications: false
      max_stock_level: 10
    
    # Re-engagement
    reengagement:
      enabled: true
      thresholds:
        - days: 30
          discount: 15
        - days: 90
          discount: 20
        - days: 180
          discount: 25
          free_shipping: true
  
  # Rate Limits
  limits:
    # Hourly sending limits
    hourly_rate: 500
    # Daily sending limits
    daily_rate: 10000
    # Minimum interval between emails to same user (seconds)
    min_interval: 3600
    # Maximum marketing emails per week per user
    max_marketing_per_week: 2
    # Maximum promotional emails per day per user
    max_promotional_per_day: 1
  
  # Monitoring & Alerts
  monitoring:
    # Webhook endpoint for email events
    webhook_url: "https://quantum.quantummint.net/webhook/email"
    
    # Dashboard refresh interval (seconds)
    dashboard_refresh: 30
    
    # Alert thresholds
    alert_thresholds:
      # Bounce rate percentage
      bounce_rate: 5.0
      # Spam report percentage
      spam_rate: 0.1
      # Unsubscribe rate percentage
      unsubscribe_rate: 0.5
      # Minimum open rate percentage
      min_open_rate: 15.0
    
    # Email admins when thresholds exceeded
    alert_recipients:
      - admin@quantummint.net
  
  # Compliance Settings
  compliance:
    # Physical mailing address (required by CAN-SPAM)
    physical_address: "123 Library Lane, Bookville, CA 90210"
    
    # Company name
    company_name: "QuantumMint Bookstore"
    
    # Automatically add unsubscribe link
    auto_unsubscribe_link: true
    
    # One-click unsubscribe (RFC 8058)
    one_click_unsubscribe: true
    
    # Preference center URL
    preference_center_url: "https://quantum.quantummint.net/email-preferences"
    
    # Privacy policy URL
    privacy_policy_url: "https://quantum.quantummint.net/privacy"
    
    # Do not send hours (local time)
    blackout_hours:
      start: 22  # 10 PM
      end: 6     # 6 AM
    
    # Honor unsubscribe immediately
    immediate_unsubscribe: true
  
  # A/B Testing
  testing:
    # Enable A/B testing
    enabled: true
    
    # Default test percentage
    test_percentage: 0.05  # 5%
    
    # Minimum sample size for valid test
    min_sample_size: 100
    
    # Statistical significance threshold
    significance_threshold: 0.95
    
    # Test subjects
    subject_line_variants: 3
  
  # Performance Targets
  targets:
    open_rate: 25.0
    click_rate: 3.0
    conversion_rate: 1.0
    unsubscribe_rate_max: 0.5
    bounce_rate_max: 2.0
  
  # Segmentation
  segments:
    # New customers (less than 30 days)
    new_customers:
      criteria:
        days_since_registration: { max: 30 }
      email_frequency: "3 per week"
    
    # Active customers (purchased in last 90 days)
    active_customers:
      criteria:
        days_since_last_purchase: { max: 90 }
      email_frequency: "2 per week"
    
    # Inactive customers (no purchase in 90+ days)
    inactive_customers:
      criteria:
        days_since_last_purchase: { min: 90 }
      email_frequency: "1 per week"
    
    # VIP customers (high lifetime value)
    vip_customers:
      criteria:
        lifetime_value: { min: 500 }
      email_frequency: "4 per week"
      exclusive_offers: true
  
  # Seasonal Campaigns
  seasonal:
    # Holiday season (Nov-Dec)
    holiday:
      enabled: true
      start_date: "11-01"
      end_date: "12-31"
      max_emails_per_week: 3
      campaigns:
        - black_friday
        - cyber_monday
        - holiday_gift_guide
        - last_shipping_date
    
    # Summer reading
    summer:
      enabled: true
      start_date: "06-01"
      end_date: "08-31"
      campaigns:
        - summer_reading_challenge
        - beach_reads
  
  # Queue Settings
  queue:
    # Redis for job queue
    redis_url: ${REDIS_URL}
    
    # Queue priorities (1-10, 10 = highest)
    priorities:
      transactional: 10
      password_reset: 9
      order_confirmation: 9
      shipping_notification: 8
      alerts: 7
      newsletters: 5
      marketing: 3
    
    # Retry settings
    retry:
      max_attempts: 3
      backoff: "exponential"
      initial_delay: 60  # seconds
  
  # Logging
  logging:
    # Log all email sends
    log_sends: true
    
    # Log email opens
    log_opens: true
    
    # Log email clicks
    log_clicks: true
    
    # Log level (debug, info, warn, error)
    level: "info"
    
    # Retention period (days)
    retention_days: 90
