version: '3.8'

services:
  # Unified API Gateway
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: quantummint-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/quantummint.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../logs/gateway:/var/log/nginx
      - ../videos:/var/www/videos:ro
      - ../audiobooks:/var/www/audiobooks:ro
      - ../ebooks:/var/www/ebooks:ro
    networks:
      - quantummint-network
    restart: unless-stopped
    depends_on:
      - video-api
      - content-api
      - subscription-service

  # Monolithic API (Auth, Wallet, Payments, Bookstore)
  monolith-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: quantummint-monolith
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - DB_NAME=${MYSQL_DATABASE:-quantummint_main}
      - DB_USER=${MYSQL_USER:-quantummint_user}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=mysql
      - STRIPE_CLIENT_ID=${STRIPE_CLIENT_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - FALLBACK_SLL_TO_USD=${FALLBACK_SLL_TO_USD:-59}
      - EXCHANGE_RATE_CACHE_TTL_MS=${EXCHANGE_RATE_CACHE_TTL_MS:-3600000}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@quantummint.net}
      - PUSH_NOTIFICATION_WEBHOOK_URL=${PUSH_NOTIFICATION_WEBHOOK_URL}
      - REFUND_SUBMIT_MAX_PER_HOUR=${REFUND_SUBMIT_MAX_PER_HOUR:-5}
      - REFUND_ADMIN_MAX_PER_WINDOW=${REFUND_ADMIN_MAX_PER_WINDOW:-60}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-120}
    networks:
      - quantummint-network
    depends_on:
      - mysql
    expose:
      - "8000"

  # MySQL Database for Monolith
  mysql:
    image: mysql:8.0
    container_name: quantummint-mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-quantummint_main}
      - MYSQL_USER=${MYSQL_USER:-quantummint_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quantummint-network
    restart: unless-stopped

  # User Management & Authentication
  auth-service:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    container_name: quantummint-auth
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/quantummint
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./config/auth:/app/config
    networks:
      - quantummint-network
    depends_on:
      - postgres
      - redis

  # Subscription Management
  subscription-service:
    build:
      context: ../services/subscription
      dockerfile: Dockerfile
    container_name: quantummint-subscription
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=quantummint_subscriptions
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - quantummint-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4100/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Video Platform
  video-api:
    build:
      context: ../services/video/api
      dockerfile: Dockerfile
    container_name: quantummint-video-api
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/quantummint_video
      - REDIS_URL=redis://redis:6379
      - UPLOAD_PATH=/var/www/videos
      - MAX_UPLOAD_SIZE=10GB
    volumes:
      - ./videos:/var/www/videos
      - ./logs/video-api:/app/logs
    networks:
      - quantummint-network

  video-processor:
    build:
      context: ../services/video/processor
      dockerfile: Dockerfile.gpu
    container_name: quantummint-video-processor
    volumes:
      - ./videos:/var/www/videos
      - /tmp:/tmp
    environment:
      - GPU_ENABLED=true
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - quantummint-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  streaming-server:
    build:
      context: ../services/video/streaming
      dockerfile: Dockerfile
    container_name: quantummint-streaming
    ports:
      - "1935:1935"
      - "8000:8000"
    volumes:
      - ./videos:/var/www/videos:ro
    networks:
      - quantummint-network

  # Unified Content API (Audiobooks, Ebooks, TTS)
  content-api:
    build:
      context: ../services/content/api
      dockerfile: Dockerfile
    container_name: quantummint-content-api
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/quantummint_bookstore
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - TTS_MODEL_PATH=/app/models/tts
      - PORT=5000
    volumes:
      - ./ebooks:/var/www/ebooks:ro
      - ./audiobooks:/var/www/audiobooks:ro
      - ./videos:/var/www/videos:ro
      - ./models/tts:/app/models/tts
      - ./audiobooks/generated:/app/generated
      - ./cache/tts:/app/cache
    networks:
      - quantummint-network
    depends_on:
      - postgres
      - redis
      - elasticsearch
    ports:
      - "5000:5000"

  formula-engine:
    build:
      context: ../services/formula-engine
      dockerfile: Dockerfile
    container_name: quantummint-formula
    volumes:
      - ./models/math:/app/models
      - ./knowledge-base:/app/knowledge
    environment:
      - SYMPY_CACHE_SIZE=1GB
      - MATHML_SUPPORT=true
    networks:
      - quantummint-network
    ports:
      - "5004:5004"

  tts-microservice:
    build:
      context: ../services/tts/python
      dockerfile: Dockerfile
    container_name: quantummint-tts-python
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5005
    networks:
      - quantummint-network
    depends_on:
      - redis
    ports:
      - "5005:5005"

  concept-visualizer:
    build:
      context: ../services/concept-visualizer
      dockerfile: Dockerfile
    container_name: quantummint-visualizer
    volumes:
      - ./models/visualization:/app/models
      - ./audiobooks/images:/app/output
      - ./cache/visualization:/app/cache
    environment:
      - GPU_ENABLED=true
      - STABLE_DIFFUSION_CHECKPOINT=/app/models/sd-scientific.ckpt
    networks:
      - quantummint-network

  knowledge-graph:
    build:
      context: ../services/knowledge-graph
      dockerfile: Dockerfile
    container_name: quantummint-knowledge
    volumes:
      - ./knowledge-base:/app/data
      - ./models/kg:/app/models
    environment:
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    networks:
      - quantummint-network
    depends_on:
      - neo4j

  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: quantummint-postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../database/init-all-databases.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_MULTIPLE_DATABASES=quantummint,quantummint_video,quantummint_audiobook,quantummint_bookstore,quantummint_subscriptions,quantummint_voice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - quantummint-network

  redis:
    image: redis:7-alpine
    container_name: quantummint-redis
    volumes:
      - ./data/redis:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - quantummint-network

  neo4j:
    image: neo4j:5-community
    container_name: quantummint-neo4j
    volumes:
      - ./data/neo4j:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    networks:
      - quantummint-network
    ports:
      - "7474:7474"

  elasticsearch:
    image: elasticsearch:8.10.0
    container_name: quantummint-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - quantummint-network
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # Frontend Interfaces
  web-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quantummint-web
    ports:
      - "3000:80"
    networks:
      - quantummint-network
    depends_on:
      - api-gateway

  admin-dashboard:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: quantummint-admin
    ports:
      - "3001:80"
    volumes:
      - ../admin/dist:/usr/share/nginx/html:ro
    networks:
      - quantummint-network

  # Monitoring & Analytics
  monitoring:
    image: grafana/grafana:latest
    container_name: quantummint-monitoring
    ports:
      - "3002:3000"
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    networks:
      - quantummint-network

  analytics-engine:
    build:
      context: ../services/analytics/engine
      dockerfile: Dockerfile
    container_name: quantummint-analytics
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/quantummint
      - REDIS_URL=redis://redis:6379
    networks:
      - quantummint-network

  # TTS Service (New Node.js version)
  tts-service:
    build:
      context: ../services/tts/node
      dockerfile: Dockerfile
    container_name: quantummint-tts-node
    environment:
      - PORT=7001
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
      - FRONTEND_URL=${FRONTEND_URL}
      - MEDIA_DIR=/app/media
    volumes:
      - ./media/tts:/app/media/tts
    networks:
      - quantummint-network
    ports:
      - "7001:7001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Voice Profile Service (New)
  voice-profile-service:
    build:
      context: ../services/voice/profile
      dockerfile: Dockerfile
    container_name: quantummint-voice-profile
    environment:
      - PORT=7002
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/quantummint_voice
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${FRONTEND_URL}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    volumes:
      - ./data/voice-profiles:/app/storage
    networks:
      - quantummint-network
    ports:
      - "7002:7002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7002/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quantummint-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  videos:
  audiobooks:
  ebooks:
  postgres-data:
  redis-data:
  neo4j-data:
  elasticsearch-data:
