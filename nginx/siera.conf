events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format siera_log '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" '
                         'service=$service_name time=$request_time';

    access_log /var/log/nginx/access.log siera_log;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting per service
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=video_upload:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=audiobook_gen:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;

    # Main server block - Siera Books Platform
    server {
        listen 80;
        server_name sierabooks.com www.sierabooks.com;
        # return 301 https://$server_name$request_uri; # Disabled for dev
        
        # ========== API ENDPOINTS ==========
        
        # Authentication endpoints
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            set $service_name "auth";
            
            proxy_pass http://auth-service:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        # Video platform endpoints
        location /api/video/ {
            set $service_name "video";
            
            # Upload endpoint has special handling
            if ($request_uri ~* "/api/video/upload") {
                limit_req zone=video_upload burst=5 nodelay;
                client_max_body_size 10G;
                proxy_request_buffering off;
            }
            
            proxy_pass http://video-api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Long timeout for processing
            proxy_read_timeout 600s;
            proxy_connect_timeout 75s;
        }

        # Audiobook & Scientific endpoints
        location /api/audiobook/ {
            set $service_name "audiobook";
            
            # Generation endpoint has rate limiting
            if ($request_uri ~* "/api/audiobook/generate") {
                limit_req zone=audiobook_gen burst=3 nodelay;
                client_max_body_size 1G;
            }
            
            proxy_pass http://audiobook-api:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Very long timeout for AI processing
            proxy_read_timeout 1800s;
            proxy_connect_timeout 300s;
        }

        # Bookstore & Ebook endpoints
        location /api/bookstore/ {
            set $service_name "bookstore";
            
            proxy_pass http://bookstore-api:3003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment endpoints
        location /api/payment/ {
            set $service_name "payment";
            
            proxy_pass http://payment-service:3004;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Security for payment endpoints
            add_header X-Frame-Options "DENY" always;
        }

        # ========== STREAMING ENDPOINTS ==========
        
        # Video streaming
        location /stream/video/ {
            proxy_pass http://streaming-server:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Cache video segments
            location ~ \.(m3u8)$ {
                add_header Cache-Control "public, max-age=30";
            }
            location ~ \.(ts|mp4)$ {
                add_header Cache-Control "public, max-age=31536000";
            }
            
            # Enable range requests
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_no_cache $http_range $http_if_range;
        }

        # Audiobook streaming
        location /stream/audiobook/ {
            alias /var/www/audiobooks/;
            internal;
            
            # Audio file types
            location ~ \.(mp3|wav|ogg|m4a)$ {
                add_header Cache-Control "public, max-age=604800";
                add_header Content-Type "audio/mpeg";
                
                # Enable byte-range requests for seeking
                mp4;
                mp4_buffer_size 1M;
                mp4_max_buffer_size 5M;
            }
        }

        # ========== STATIC CONTENT ==========
        
        # Ebook downloads
        location /downloads/ebooks/ {
            alias /var/www/ebooks/;
            internal;
            
            # Secure download links
            # secure_link $arg_token;
            # secure_link_md5 "$secure_link_expires$uri$remote_addr ${SECURE_LINK_SECRET}";
            
            # if ($secure_link = "") {
            #     return 403;
            # }
            
            # if ($secure_link = "0") {
            #     return 410;
            # }
            
            add_header Content-Disposition "attachment";
            add_header Cache-Control "private, no-cache";
        }

        # Video downloads
        location /downloads/videos/ {
            alias /var/www/videos/;
            internal;
            
            # secure_link $arg_token;
            # secure_link_md5 "$secure_link_expires$uri$remote_addr ${SECURE_LINK_SECRET}";
            
            # if ($secure_link = "") { return 403; }
            # if ($secure_link = "0") { return 410; }
        }

        # ========== ADMIN & MONITORING ==========
        
        location /admin/ {
            # Basic authentication
            # auth_basic "Siera Books Admin";
            # auth_basic_user_file /etc/nginx/htpasswd/admin;
            
            proxy_pass http://admin-dashboard:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /monitoring/ {
            # auth_basic "Monitoring Access";
            # auth_basic_user_file /etc/nginx/htpasswd/monitoring;
            
            proxy_pass http://monitoring:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========== HEALTH CHECKS ==========
        
        location /health {
            access_log off;
            return 200 "healthy";
        }

        # ========== WEB FRONTEND ==========
        
        location / {
            proxy_pass http://web-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                proxy_pass http://web-frontend:80;
            }
        }

        # ========== ERROR PAGES ==========
        
        error_page 404 /404.html;
        location = /404.html {
            root /var/www/html;
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/www/html;
            internal;
        }
    }
}
