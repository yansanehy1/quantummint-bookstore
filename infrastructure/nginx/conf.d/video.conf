# infrastructure/nginx/conf.d/video.conf

# ===== HLS/DASH Streaming with Auth & Caching =====
map $http_range $range_key {
    default $http_range;
    "" "none";
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=video_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=video_stream:10m rate=100r/s;

# Upstream definitions
upstream video_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream streaming_server {
    server 127.0.0.1:8000;
    keepalive 64;
}

# ===== Video Upload Endpoints (proxied to Express) =====
location /api/upload {
    limit_req zone=video_api burst=20 nodelay;
    
    # Client body size for chunked uploads (5MB max per chunk)
    client_max_body_size 5M;
    client_body_buffer_size 1M;
    
    proxy_pass http://video_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts for large uploads
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Buffering for chunked uploads
    proxy_request_buffering off;
    proxy_buffering off;
}

# ===== Video Job Status (authenticated) =====
location /api/videos/ {
    limit_req zone=video_api burst=50 nodelay;
    
    # Auth subrequest to video-api
    auth_request /auth/video-check;
    auth_request_set $auth_status $upstream_status;
    
    proxy_pass http://video_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI $request_uri;
}

# Internal auth check endpoint
location = /auth/video-check {
    internal;
    proxy_pass http://video_api/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-User-Token $http_authorization;
}

# ===== HLS/DASH Streaming (with auth + caching) =====
location /stream/ {
    limit_req zone=video_stream burst=200 nodelay;
    
    # Auth check for private videos
    auth_request /auth/stream-check;
    auth_request_set $auth_status $upstream_status;
    
    # Serve from video storage (NVMe for fast I/O)
    alias /mnt/nvme/video_data/encoded/;
    
    # Disable directory listing
    autoindex off;
    
    # CORS for video.js/hls.js players
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    
    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    
    # ===== HLS Manifests (short cache) =====
    location ~* \.m3u8$ {
        add_header Content-Type application/vnd.apple.mpegurl;
        add_header Cache-Control "public, max-age=30, must-revalidate";
        add_header Vary "Authorization";
        
        # Prevent hotlinking
        valid_referers none blocked server_names *.quantummint.net;
        if ($invalid_referer) {
            return 403;
        }
    }
    
    # ===== DASH Manifests =====
    location ~* \.mpd$ {
        add_header Content-Type application/dash+xml;
        add_header Cache-Control "public, max-age=30, must-revalidate";
        add_header Vary "Authorization";
    }
    
    # ===== HLS Segments (long cache, immutable) =====
    location ~* \.(ts|m4s)$ {
        add_header Content-Type video/MP2T;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Enable range requests for seeking
        add_header Accept-Ranges bytes;
        
        # Serve with sendfile for zero-copy I/O
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Open file cache for frequently accessed segments
        open_file_cache max=1000 inactive=20s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
    }
    
    # ===== Thumbnails & Previews (public) =====
    location ~* /thumbnail/.*\.(jpg|png)$ {
        add_header Content-Type image/jpeg;
        add_header Cache-Control "public, max-age=86400";
    }
    
    location ~* /preview\.mp4$ {
        add_header Content-Type video/mp4;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # ===== MP4 Downloads (authenticated) =====
    location ~* /mp4/.*\.mp4$ {
        add_header Content-Type video/mp4;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Disposition "inline";
        
        # Range request support for seeking
        add_header Accept-Ranges bytes;
        
        # Stream with proper headers
        sendfile on;
        tcp_nopush on;
    }
}

# Internal stream auth check
location = /auth/stream-check {
    internal;
    proxy_pass http://streaming_server/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-User-Token $http_authorization;
}

# ===== Prometheus Metrics Endpoint =====
location /metrics {
    # Only allow internal monitoring or authenticated access
    allow 127.0.0.1;
    allow 10.0.0.0/8;  # Adjust to your monitoring network
    deny all;
    
    proxy_pass http://video_api/metrics;
    proxy_set_header Host $host;
}

# ===== Health Checks =====
location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}
