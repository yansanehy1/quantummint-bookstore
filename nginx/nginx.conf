events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream video_api {
        server video-api:3000;
    }

    upstream streaming_server {
        server streaming-server:8000;
    }

    upstream admin_dashboard {
        server admin-dashboard:8081;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/ {
            proxy_pass http://video_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /stream/ {
            proxy_pass http://streaming_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /admin/ {
            proxy_pass http://admin_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
