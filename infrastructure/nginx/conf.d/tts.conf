# infrastructure/nginx/conf.d/tts.conf

# Rate limiting for TTS synthesis
limit_req_zone $binary_remote_addr zone=tts_limit:10m rate=5r/s;

# Upstream for the Python FastAPI TTS service
upstream tts_service {
    server 127.0.0.1:8000; # Assuming container port 8000 mapped to host 8000
    keepalive 32;
}

# Upstream for the Node.js backend proxy
upstream backend_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ===== TTS Synthesis Proxy =====
location /api/tts/ {
    limit_req zone=tts_limit burst=10 nodelay;
    
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Increase timeouts for long audio synthesis
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# ===== Formula & Breakdown Endpoints =====
location /api/formula/ {
    limit_req zone=tts_limit burst=20 nodelay;
    
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ===== Interaction Logging =====
location /api/interaction/ {
    limit_req zone=tts_limit burst=50 nodelay;
    
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ===== Internal TTS Service (Direct Access if needed internally) =====
location /internal/tts/ {
    internal; # Only accessible from within NGINX or specified networks
    proxy_pass http://tts_service/;
    proxy_set_header Host $host;
}
