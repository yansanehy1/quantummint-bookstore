version: '3.8'

services:
  # STEM Visualization Engine
  formula-engine:
    build:
      context: ../services/formula-engine
    container_name: quantummint-formula
    networks:
      - quantummint-network

  concept-visualizer:
    build:
      context: ../services/concept-visualizer
    container_name: quantummint-visualizer
    networks:
      - quantummint-network

  knowledge-graph:
    build:
      context: ../services/knowledge-graph
    container_name: quantummint-knowledge
    networks:
      - quantummint-network

networks:
  quantummint-network:
    external: true
